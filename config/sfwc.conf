# SFWC configuration  (~/.config/sfwc/sfwc.conf)
# Comments must be on their own line (start with '#' or ';'). Inline comments
# are NOT supported, so values like #rrggbb are safe. Format: key = value.

[general]
theme = default
# click | follow-mouse
focus = click
terminal = foot

[windows]
default_layout = floating
snap_to_edges = true
snap_distance = 12
gap = 8

[animations]
enabled = true
# none | fade | fade-scale | slide
open = fade-scale
close = fade
move = true
resize = true
duration_ms = 180
# linear | ease-in | ease-out | ease-in-out
easing = ease-out

[keybinds]
# modifier+key = action
Super+Return = spawn:$terminal
Super+q = close
Super+f = toggle-maximize
Super+m = minimize
Super+Tab = cycle-windows
Super+Shift+e = quit
Super+Shift+r = reload-config

[autostart]
# Programs started with the compositor (one per line). They are started after
# the theme has been applied. Remove or comment out whatever you don't use.
exec = swaybg -c $theme.background
exec = waybar -c ~/.config/waybar/config -s $runtime/sfwc/waybar.css

[mouse]
# Hold the modifier and drag with a button
Super+Left = move
Super+Right = resize
