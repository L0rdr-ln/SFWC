# SFWC configuration  (~/.config/sfwc/sfwc.conf)
# Lines starting with '#' are comments. Format: key = value, [section] headers.

[general]
theme = default
focus = click            # click | follow-mouse
terminal = foot

[windows]
default_layout = floating
snap_to_edges = true
snap_distance = 12
gap = 8

[animations]
enabled = true
open = fade-scale        # none | fade | fade-scale | slide
close = fade
move = true
resize = true
duration_ms = 180
easing = ease-out        # linear | ease-in | ease-out | ease-in-out

[keybinds]
# modifier+key = action
Super+Return = spawn:$terminal
Super+q = close
Super+f = toggle-maximize
Super+m = minimize
Super+Tab = cycle-windows
Super+Shift+e = quit
Super+Shift+r = reload-config

[mouse]
# Hold the modifier and drag with a button
Super+Left = move
Super+Right = resize
