# SFWC configuration  (~/.config/sfwc/sfwc.conf, or $SFWC_CONFIG)
#
# Comments must be on their own line (start with '#' or ';'); inline comments
# are NOT supported, so values like #rrggbb are safe.
# Changes are applied automatically when the file is saved (or with the
# reload-config action). Mistakes are reported in the compositor log with the
# line number, and the setting keeps its default.

[general]
theme = default
# click | follow-mouse
focus = click
terminal = foot
# Modifier used as $mod in the binds below: Alt (works when nested in another
# compositor) or Super (typical on a TTY). Put this line before the binds.
mod = Alt
# number of workspaces, 1 to 9
workspaces = 4

[windows]
default_layout = floating
# draw titlebars and borders (server-side decorations)
decorations = true
snap_to_edges = true
# pixels from a screen edge or another window at which a moved window snaps to it
snap_distance = 12
# also snap to the edges of other windows (keeping `gap` between them)
snap_to_windows = true
# space between windows/screen edges when maximizing, snapping and placing
gap = 8

[keyboard]
# xkb names; an empty value means the system default. Examples:
#   layout = de      variant = nodeadkeys      options = caps:escape
layout =
variant =
options =
# characters per second (0 turns key repeat off) and the delay before it starts, in ms
repeat_rate = 25
repeat_delay = 600

# Per-output settings: [output:NAME], NAME is what the log shows ("output HDMI-A-1 added").
# scale = 0.25-10, position = x,y in layout pixels, enabled = false turns the output off
# (read when the output appears). Example, uncomment to use:
# [output:HDMI-A-1]
# scale = 1.5
# position = 0,0

[animations]
# open, close and move animations; set enabled = false to turn them off
enabled = true
# none | fade | fade-scale | slide
open = fade-scale
close = fade
move = true
resize = true
duration_ms = 180
# linear | ease-in | ease-out | ease-in-out
easing = ease-out

# Hyprland style animations. As soon as you add `animation =` lines they replace the simple keys
# above for the types they name. Speed is in units of 100 ms.
#   preset = hyprland          (or minimal, none) a ready-made set, change what you like below it
#   bezier = name, x0, y0, x1, y1
#   animation = windowsIn, 1, 4, easeOutQuint, popin 87%
#   animation = windowsOut, 1, 1.5, linear, popin 87%
#   animation = fadeIn, 1, 1.7, almostLinear
#   animation = border, 1, 5, easeOutQuint
#   animation = workspaces, 1, 2, easeOutQuint, slide
#   animation = layers, 1, 4, easeOutQuint
# Wayfire style effects: popin/slide/slidefade, and also  fire  squeeze  zoom 70%
#   animation = windowsOut, 1, 6, default, fire
#   fire_particles = 400
#   fire_size = 14
#   fire_color = #ff7a18
# See docs/CONFIGURATION.md for all types and styles.
# preset = hyprland

# Having a [keybinds] section replaces ALL built-in binds, so list every one
# you want. Format: <modifiers>+<key> = <action>
# Modifiers: $mod, Alt, Super, Ctrl, Shift. Key: any xkb keysym name (Return, Tab,
# Escape, F11, q, ...), written as the unshifted key (use Shift+m, not M).
# Actions: spawn:<command>, close, toggle-maximize, toggle-fullscreen, minimize,
#          restore-minimized, cycle-windows, reload-config, quit,
#          move-to-next-output, focus-next-output,
#          workspace:<1-9>, move-to-workspace:<1-9>
[keybinds]
$mod+Return = spawn:$terminal
$mod+q = close
$mod+Tab = cycle-windows
$mod+f = toggle-maximize
$mod+F11 = toggle-fullscreen
$mod+m = minimize
$mod+Shift+m = restore-minimized
$mod+Shift+r = reload-config
$mod+o = move-to-next-output
$mod+Shift+o = focus-next-output
$mod+Escape = quit
$mod+1 = workspace:1
$mod+Shift+1 = move-to-workspace:1
$mod+2 = workspace:2
$mod+Shift+2 = move-to-workspace:2
$mod+3 = workspace:3
$mod+Shift+3 = move-to-workspace:3
$mod+4 = workspace:4
$mod+Shift+4 = move-to-workspace:4

# Hold the modifier and drag: Left, Right or Middle button = move | resize
[mouse]
$mod+Left = move
$mod+Right = resize

# Companion tools follow the theme: the compositor renders the theme's templates (waybar,
# fuzzel, foot, mako, swaylock) to $XDG_RUNTIME_DIR/sfwc/ on start and reload.
# See docs/THEMES.md. Switch all or single templates off here.
[templates]
enabled = true
# waybar = false

# Programs started once with the compositor (one per line).
# $terminal, $theme (theme name) and $runtime ($XDG_RUNTIME_DIR) are expanded.
# Examples (remove the leading '#' to enable):
[autostart]
# theme colors work here too: @colors.background:hex@ is the theme's background without '#'
# exec = swaybg -c @colors.background:hex@
# exec = waybar
