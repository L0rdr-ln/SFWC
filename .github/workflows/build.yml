name: build
on: [push, pull_request]
jobs:
  parser-tests:
    timeout-minutes: 10
    # Parser + shipped config/theme files, with sanitizers. No wlroots needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Lock::Timeout=120 update && sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Lock::Timeout=120 install -y meson ninja-build gcc pkg-config libxkbcommon-dev libcairo2-dev libpango1.0-dev libfontconfig-dev fonts-dejavu-core
      - run: meson setup build-test -Dcompositor=false -Db_sanitize=address,undefined -Db_lundef=false
      - run: meson test -C build-test --print-errorlogs

  compositor:
    timeout-minutes: 20
    # Builds wlroots 0.20 from the subproject wrap, then sfwc with sanitizers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Lock::Timeout=120 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Lock::Timeout=120 install -y meson ninja-build pkg-config gcc git cmake \
            libwayland-dev wayland-protocols libxkbcommon-dev libcairo2-dev libpango1.0-dev libfontconfig-dev fonts-dejavu-core libpixman-1-dev \
            libdrm-dev libinput-dev libudev-dev libseat-dev libegl-dev libgles-dev \
            libgbm-dev libvulkan-dev glslang-tools hwdata libdisplay-info-dev \
            libliftoff-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev \
            libxcb-render0-dev libxcb-xfixes0-dev libxcb-res0-dev libxcb-ewmh-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-render-util0-dev
      - name: Newer meson (wlroots 0.18+ needs C23 support, meson >= 1.4)
        run: python3 -m pip install --user "meson>=1.4,<2" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: meson setup build -Dwlroots:examples=false -Dwayland:documentation=false -Dwayland:tests=false -Dwayland:dtd_validation=false -Db_sanitize=address,undefined -Db_lundef=false
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - name: Smoke test (headless backend, clean shutdown on SIGINT)
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)" && chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
          timeout --preserve-status -s INT 3 ./build/sfwc
      - name: Install into a staging directory and check the files
        run: |
          meson install -C build --destdir "$PWD/stage" --skip-subprojects
          cd stage/usr/local
          for f in bin/sfwc bin/sfwc-theme-apply share/sfwc/sfwc.conf \
                   share/wayland-sessions/sfwc.desktop share/man/man1/sfwc.1 \
                   share/man/man1/sfwc-theme-apply.1 share/man/man5/sfwc.conf.5 \
                   share/doc/sfwc/CONFIGURATION.md; do
            test -s "$f" || { echo "missing from the install: $f"; exit 1; }
          done
