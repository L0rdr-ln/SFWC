# Temporary, for the wlroots 0.20 port: prints parts of the wlroots headers.
name: inspect-wlroots
on:
  push:
    paths: ['.github/workflows/inspect-wlroots.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: git clone --quiet --depth 1 --branch 0.20.0 https://gitlab.freedesktop.org/wlroots/wlroots.git
      - name: xdg-shell geometry
        run: |
          grep -n -B4 -A4 "geometry" wlroots/include/wlr/types/wlr_xdg_shell.h
          echo ---- surface.c; grep -n "geometry" wlroots/types/xdg_shell/wlr_xdg_surface.c | head -30
